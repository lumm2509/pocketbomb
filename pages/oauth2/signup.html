{{define "content"}}
<h1>Create account</h1>
{{if .Name}}<p class="subtitle">to continue to <strong>{{.Name}}</strong></p>{{end}}

{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}

<form method="post" action="{{.Action}}">
    <input type="hidden" name="auth_state" value="{{.AuthState}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Email
        <input type="email" name="email" autocomplete="email" required value="{{.Email}}">
    </label>
    <label>Password
        <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>Password confirm
        <input type="password" name="passwordConfirm" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
</form>

{{if .LoginURL}}<div class="links"><p>Already have an account? <a href="{{.LoginURL}}">Sign in</a></p></div>{{end}}
{{end}}
