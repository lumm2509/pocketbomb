{{define "content"}}
<h1>Check your email</h1>
{{if .Name}}<p class="subtitle">to continue to <strong>{{.Name}}</strong></p>{{end}}

{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
{{if .SentInfo}}<div class="notice" role="status">{{.SentInfo}}</div>{{end}}

<form method="post" action="{{.Action}}">
    <input type="hidden" name="auth_state" value="{{.AuthState}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>One-time code
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
    </label>
    <button type="submit">Verify code</button>
</form>

{{if .BackURL}}<div class="links"><p><a href="{{.BackURL}}">Use another sign-in method</a></p></div>{{end}}
{{end}}
